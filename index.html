<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Credenciamento - CFIAe</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-cfiae">
        <div class="top-bar">
            <div class="header-container">
                <img src="logo.png" alt="Logo CFIAe" class="header-logo">
                <div class="header-titles">
                    <span class="sub-title">Força Aérea Brasileira</span>
                    <h1 class="main-title">Caixa de Financiamento<br>Imobiliário da Aeronáutica</h1>
                </div>
            </div>
        </div>
        <div class="sub-bar">
            <div class="sub-bar-container">
                <span class="slogan">"UM SONHO, UM IDEAL, UMA MORADIA DIGNA!"</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="map-container">
            <object data="mapa_brasil.svg" type="image/svg+xml" id="mapa"></object>
        </div>
    </main>

    <!-- Modal para Exibição das Empresas Credenciadas -->
    <div id="modal-empresas" class="modal-overlay hidden">
        <div class="modal-card">
            <button id="modal-close" class="modal-close-btn">&times;</button>
            
            <div class="modal-header">
                <h2 id="modal-region-title" class="modal-title">Região</h2>
                <span id="modal-badge" class="modal-badge">0 empresa(s)</span>
            </div>

            <div class="modal-body">
                <p class="modal-subtitle">Empresas Credenciadas Habilitadas:</p>
                <ul id="modal-empresas-list" class="modal-list">
                    <!-- Empresas injetadas via JS -->
                </ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
