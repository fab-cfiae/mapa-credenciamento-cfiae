<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Credenciamento - CFIAe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-cfiae">
        <!-- Barra Superior Principal -->
        <div class="top-bar">
            <div class="header-container">
                <img src="logo.png" alt="Logo CFIAe" class="header-logo">
                
                <div class="header-titles">
                    <span class="sub-title">Força Aérea Brasileira</span>
                    <h1 class="main-title">Caixa de Financiamento<br>Imobiliário da Aeronáutica</h1>
                </div>
            </div>
        </div>

        <!-- Sub-barra Azul Escuro com o Slogan -->
        <div class="sub-bar">
            <div class="sub-bar-container">
                <span class="slogan">"UM SONHO, UM IDEAL, UMA MORADIA DIGNA!"</span>
            </div>
        </div>
    </header>

    <!-- Área principal centralizada -->
    <main class="main-content">
        <div class="map-container">
            <object data="mapa_brasil.svg" type="image/svg+xml" id="mapa"></object>
            <div id="tooltip" class="tooltip hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
